<script>
/* ===================== DATOS DE DEMOSTRACIÓN ===================== */

const TYPE_ONE = {'Lecturas':'Lectura','Talleres':'Taller','Guías':'Guía','Presentaciones':'Presentación','Ejercicios':'Ejercicios','Actividades participativas':'Actividad participativa','Proyectos de aula':'Proyecto de aula'};
const PROCESSES = ['Formular preguntas','Contrastar fuentes','Explicar con sus palabras','Transferir a otro contexto','Aprender del error','Crear para comunicar'];
const PROC_DESC = {
  'Formular preguntas':'Los estudiantes pasan de recibir respuestas a hacer preguntas que se pueden investigar.',
  'Contrastar fuentes':'Comparan lo que dicen un video, la IA, un libro o un experto, y deciden en qué confiar.',
  'Explicar con sus palabras':'Reconstruyen la idea sin copiarla. Si pueden explicarla, la comprendieron.',
  'Transferir a otro contexto':'Usan lo aprendido en una situación nueva, cercana a su vida o a su territorio.',
  'Aprender del error':'El error se vuelve información: lo buscan, lo explican y lo corrigen.',
  'Crear para comunicar':'Producen algo para una audiencia real, lo que obliga a ordenar y profundizar lo que saben.',
};
const STRATS = ['Aprendizaje basado en proyectos','Gamificación','Aprendizaje colaborativo','Pensamiento crítico','Promoción de la lectura','Aprendizaje significativo'];
const CATS = ['Experiencias exitosas','Preguntas entre docentes','Recursos compartidos','Ideas para el aula','Promoción de la lectura','Innovación pedagógica'];

const AREA_STYLE = {
  'Lengua castellana': {c:'#5B3BE0', bg:'#EFEBFF', icon:'bookopen'},
  'Matemáticas': {c:'#0B7F74', bg:'#DCF5F1', icon:'calc'},
  'Ciencias naturales': {c:'#2F7D32', bg:'#E5F4E3', icon:'flask'},
  'Ciencias sociales': {c:'#B4470E', bg:'#FCEBDD', icon:'landmark'},
  'Tecnología e informática': {c:'#24356F', bg:'#E3E8F7', icon:'cpu'},
  'Transversales': {c:'#A61E55', bg:'#FBE4EE', icon:'compass'},
};
const CAT_STYLE = {
  'Experiencias exitosas': {c:'#0B7F74', bg:'#DCF5F1', icon:'sparkles'},
  'Preguntas entre docentes': {c:'#5B3BE0', bg:'#EFEBFF', icon:'help'},
  'Recursos compartidos': {c:'#24356F', bg:'#E3E8F7', icon:'file'},
  'Ideas para el aula': {c:'#9A5B00', bg:'#FDF0D5', icon:'bulb'},
  'Promoción de la lectura': {c:'#A61E55', bg:'#FBE4EE', icon:'bookopen'},
  'Innovación pedagógica': {c:'#2F7D32', bg:'#E5F4E3', icon:'target'},
};

const T = {
  daniel:{name:'Daniel', inst:'I.E. Barrio Nuevo', city:'Medellín', area:'Lengua castellana', daniel:true},
  marcela:{name:'Marcela Ríos', inst:'I.E. La Esperanza', city:'Bello', area:'Matemáticas', color:'#5B3BE0'},
  jhon:{name:'Jhon Fredy Cardona', inst:'I.E. Alto de las Flores', city:'Envigado', area:'Ciencias naturales', color:'#0B7F74'},
  paola:{name:'Paola Andrea Mosquera', inst:'I.E. Ribera del Atrato', city:'Quibdó', area:'Ciencias sociales', color:'#B4470E'},

  andres:{name:'Andrés Felipe Gil', inst:'I.E. Pance Verde', city:'Cali', area:'Transversales', color:'#0E6E8C'},
};

const RESOURCES = [
  {id:'r1', proc:['Formular preguntas', 'Contrastar fuentes'], title:'Bitácora de preguntas: ¿por qué llueve en las tardes?', desc:'Proyecto de observación del clima durante tres semanas. Los estudiantes registran datos, formulan preguntas y las contrastan con fuentes.', grades:['6','7'], area:'Ciencias naturales', type:'Proyectos de aula', strategy:'Aprendizaje basado en proyectos', author:'jhon', file:{name:'bitacora-preguntas-clima.pdf', size:'1,2 MB'}, duration:'3 semanas · 6 sesiones', rec:'Empieza sin explicar el ciclo del agua. Deja que la pregunta del título se quede en el tablero durante todo el proyecto y vuelve a ella al final de cada sesión.', obj:['Registrar datos de forma sistemática','Formular preguntas investigables','Contrastar hipótesis con fuentes confiables'], mat:['Cuaderno o bitácora','Termómetro y vaso graduado','Acceso a datos del IDEAM (opcional)']},
  {id:'r2', proc:['Transferir a otro contexto', 'Explicar con sus palabras'], title:'Funciones lineales con la factura de servicios', desc:'Guía para descubrir pendiente e intercepto a partir del cargo fijo y el valor por unidad que aparecen en una factura real.', grades:['9'], area:'Matemáticas', type:'Guías', strategy:'Aprendizaje significativo', author:'marcela', file:{name:'guia-funciones-factura.pdf', size:'860 KB'}, duration:'2 sesiones de 55 min', rec:'Pide que tapen nombres y direcciones. Ten facturas de reserva. No uses las palabras "pendiente" ni "intercepto" hasta que el grupo las haya descrito con sus propias palabras.', obj:['Interpretar una relación lineal en contexto','Calcular la pendiente a partir de datos reales','Comunicar resultados a la familia'], mat:['Facturas de servicios (anonimizadas)','Calculadora','Plantilla de tabla de valores']},
  {id:'r3', proc:['Crear para comunicar', 'Aprender del error'], title:'Microrrelatos de 100 palabras', desc:'Taller de escritura breve con lectura previa de microficción latinoamericana y una galería de publicación en el pasillo.', grades:['7','8'], area:'Lengua castellana', type:'Talleres', strategy:'Promoción de la lectura', author:'luz', file:{name:'taller-microrrelatos.pdf', size:'540 KB'}, duration:'3 sesiones', rec:'Lee en voz alta tres microrrelatos muy distintos antes de pedir que escriban. La restricción de 100 palabras funciona mejor si la cuentan entre parejas.', obj:['Reconocer la economía del lenguaje','Escribir para una audiencia real','Dar y recibir retroalimentación entre pares'], mat:['Selección de microrrelatos','Fichas de colores','Cinta para la galería']},
  {id:'r4', proc:['Transferir a otro contexto', 'Crear para comunicar'], title:'Cartografía social: el barrio que habito', desc:'Actividad de recorrido y mapeo colectivo de lugares seguros, de encuentro y de riesgo alrededor del colegio.', grades:['8','9'], area:'Ciencias sociales', type:'Actividades participativas', strategy:'Aprendizaje colaborativo', author:'paola', file:{name:'cartografia-social-guia.pdf', size:'2,1 MB'}, duration:'2 a 3 sesiones', rec:'Gestiona el permiso de salida con tiempo. Si no es posible salir, trabaja con mapas impresos y la memoria de los estudiantes.', obj:['Reconocer el territorio como construcción social','Representar información espacial','Dialogar sobre convivencia'], mat:['Papel kraft','Marcadores de colores','Mapa base impreso del sector']},
  {id:'r5', proc:['Aprender del error', 'Explicar con sus palabras'], title:'Escape room de fracciones y porcentajes', desc:'Cinco candados en papel que solo se abren resolviendo retos de fracciones, descuentos y porcentajes.', grades:['6','7'], area:'Matemáticas', type:'Actividades participativas', strategy:'Gamificación', author:'marcela', file:{name:'escape-room-fracciones.zip', size:'4,8 MB'}, duration:'1 sesión de 90 min', rec:'Arma grupos de cuatro con roles rotativos. Las pistas extra cuestan tiempo, no puntos, así nadie se queda por fuera.', obj:['Operar con fracciones y porcentajes','Trabajar en equipo bajo reglas claras','Argumentar procedimientos'], mat:['Sobres y candados de papel','Hojas de retos impresas','Cronómetro']},
  {id:'r6', proc:['Contrastar fuentes', 'Formular preguntas'], title:'Lectura crítica de noticias falsas en redes', desc:'Selección de piezas reales anonimizadas para analizar fuentes, intenciones y formatos de desinformación.', grades:['10','11'], area:'Transversales', type:'Lecturas', strategy:'Pensamiento crítico', author:'andres', file:{name:'lectura-critica-noticias.pdf', size:'1,5 MB'}, duration:'2 sesiones', rec:'Empieza con una noticia que el grupo haya visto circular. La pregunta clave no es "¿es falsa?" sino "¿quién gana si la creo?".', obj:['Identificar fuentes y autores','Reconocer recursos de manipulación','Contrastar información'], mat:['Piezas impresas o proyectadas','Lista de verificación de fuentes']},
  {id:'r7', proc:['Crear para comunicar', 'Explicar con sus palabras'], title:'Pódcast de recreo: reseñas literarias en audio', desc:'Proyecto para grabar reseñas de libros de la biblioteca escolar y reproducirlas en el descanso.', grades:['6','7','8'], area:'Lengua castellana', type:'Proyectos de aula', strategy:'Promoción de la lectura', author:'luz', file:{name:'podcast-de-recreo-guion.pdf', size:'720 KB'}, duration:'4 sesiones', rec:'La calidad del audio importa poco. Lo que transforma la actividad es que haya una audiencia real: el colegio entero escuchando en el descanso.', obj:['Leer con un propósito comunicativo','Planear un guion oral','Recomendar con argumentos'], mat:['Celulares para grabar','Plantilla de guion','Libros de la biblioteca escolar']},

function seedPosts(){ return [
  {id:'p8', author:'daniel', cat:'Ideas para el aula', kind:'full', grade:'10', area:'Lengua castellana', title:'Mis estudiantes sí tienen curiosidad: la estaban usando fuera del aula', body:'Le pregunté a 10.º qué habían aprendido esta semana fuera del colegio. Uno aprendió a arreglar la cadena de la bicicleta con YouTube. Otra sabía un montón de historia de Roma por TikTok. Un tercero le había preguntado a la IA por qué soñamos. Ninguno lo hizo por nota. Así que probé algo: cada uno trae una pregunta que le haya despertado un video, una red o la IA, y en clase elegimos una para investigarla a fondo.', problem:'Sentía que la curiosidad se había ido del salón.', strategy:'Partir de las preguntas que ellos traen y llevarlas a lectura, contraste de fuentes y escritura.', questions:'¿Por qué soñamos? ¿Los romanos tenían redes sociales? ¿Quién decide qué video se vuelve viral?', stuck:'Querían quedarse con la primera respuesta que encontraban. Les pedí tres fuentes distintas y ahí empezó la discusión de verdad.', results:'Escribieron más que en todo el periodo. Y por primera vez discutieron entre ellos qué fuente era más confiable.', tools:'TikTok, YouTube y la IA como chispa. Libros de la biblioteca y artículos para contrastar.', recommend:'No compitan con el celular: úsenlo como punto de partida. Lo que el aula agrega es la profundidad.', proc:['Formular preguntas','Contrastar fuentes'], tags:['curiosidad','preguntas','lectura'], likes:88, date:hAgo(2), comments:[{id:'c11', a:'luz', t:'Lo voy a probar con 7.º. ¿Cómo eliges cuál pregunta investigar?', d:hAgo(1)}]},
  {id:'p6', author:'daniel', cat:'Preguntas entre docentes', kind:'short', grade:'all', area:'Transversales', title:'¿Cuál fue la última pregunta de un estudiante que les cambió la clase?', body:'La semana pasada, leyendo a Rulfo con 10.º, un estudiante me preguntó si los muertos de Comala sabían que estaban muertos. Dejé la guía a un lado y nos quedamos cuarenta minutos en esa pregunta. Les cuento la mía y me encantaría leer las suyas.', tags:['preguntas','curiosidad'], likes:71, date:hAgo(4), comments:[{id:'c1', a:'luz', t:'Una niña de 6.º me preguntó por qué los libros no tienen sonido. Terminamos haciendo audiolibros.', d:hAgo(2)},{id:'c2', a:'jhon', t:'"¿Por qué el agua de la quebrada sabe distinto en verano?" Todavía estamos investigando.', d:hAgo(1)}]},
  {id:'p2', author:'jhon', cat:'Preguntas entre docentes', kind:'short', grade:'10', area:'Ciencias naturales', title:'¿Cómo manejan el celular en el laboratorio sin prohibirlo?', body:'En el colegio la norma es guardarlo, pero en el laboratorio de química les serviría para cronometrar, grabar la reacción y tomar fotos para el informe. El problema es que en cinco minutos ya están en otra cosa. ¿Alguien tiene acuerdos de aula que le hayan funcionado?', tags:['celular','acuerdos de aula'], likes:18, date:hAgo(9), comments:[{id:'c3', a:'luz', t:'Yo uso el "celular con rol": uno por grupo, y quien lo tiene es el registrador. Rotamos cada clase.', d:hAgo(5)},{id:'c4', a:'camilo', t:'Pídeles un entregable que solo se pueda hacer con el celular, como un video de 30 segundos explicando la reacción. Cambia la relación con el aparato.', d:hAgo(3)}]},
  {id:'p1', author:'marcela', cat:'Experiencias exitosas', kind:'full', grade:'9', area:'Matemáticas', title:'Funciones lineales con la factura de servicios de la casa', body:'Llevaba años explicando y = mx + b con los ejemplos del libro y mis estudiantes de 9.º no veían para qué. Esta vez les pedí que trajeran una factura de servicios con los datos personales tapados. Calculamos el cargo fijo y el valor por metro cúbico, y de ahí salieron la pendiente y el intercepto sin que yo dijera esas palabras.', problem:'Desinterés y la pregunta de siempre: ¿y esto para qué sirve?', strategy:'Aprendizaje significativo con datos reales del hogar, trabajo en parejas y socialización en plenaria.', results:'26 de 31 estudiantes resolvieron el reto final. Dos familias me escribieron porque los chicos les explicaron cómo leer la factura.', recommend:'Pidan tapar nombres y direcciones. Lleven un par de facturas de reserva para quien no pueda traer.', questions:'¿Por qué pago aunque no gaste agua? ¿Qué pasa si el precio por metro cúbico sube?', stuck:'Confundían el cargo fijo con el consumo. Se destrabaron cuando graficaron un mes sin consumo.', tools:'Facturas reales y una calculadora. Dos estudiantes buscaron en YouTube cómo se calcula el estrato y lo explicaron al grupo.', proc:['Transferir a otro contexto','Explicar con sus palabras'], tags:['funciones','contexto real'], likes:42, date:hAgo(26), linkedResource:'r2', comments:[{id:'c5', a:'jhon', t:'Lo voy a cruzar con el consumo de agua en ciencias. ¿Te animas a hacerlo interdisciplinar?', d:hAgo(20)},{id:'c6', a:'daniel', t:'Me encanta que la pregunta "¿para qué sirve?" la respondieran ellos y no tú. Eso es lo que más se queda.', d:hAgo(18)}]},
  {id:'p5', author:'camilo', cat:'Innovación pedagógica', kind:'full', grade:'11', area:'Tecnología e informática', title:'Usé IA para retroalimentar ensayos de 11.º: lo que funcionó y lo que no', body:'Durante un periodo usé un asistente de IA para generar una primera retroalimentación sobre estructura y argumentación. Sirvió para dar comentarios rápidos a 38 estudiantes. No sirvió cuando intenté usarla para poner nota: era inconsistente y los estudiantes lo notaron.', problem:'Tiempo: tres cursos de 11.º y ensayos semanales.', strategy:'La IA como primer lector, el docente como evaluador final y una rúbrica compartida con el grupo.', results:'Más borradores entregados y menos copia, porque el proceso era visible.', recommend:'Nunca suban datos personales de los estudiantes. Explíquenles cómo se usa la herramienta y por qué.', stuck:'Al principio aceptaban todo lo que decía la IA. Cambió cuando les pedí justificar qué comentario aceptaban y cuál no.', tools:'Un asistente de IA como primer lector y una rúbrica construida con el grupo.', proc:['Aprender del error','Contrastar fuentes'], tags:['IA','evaluación formativa'], likes:64, date:hAgo(30), comments:[{id:'c7', a:'daniel', t:'Gracias por contar lo que no funcionó, Camilo. Eso vale tanto como lo que sí.', d:hAgo(12)},{id:'c8', a:'marcela', t:'¿Qué rúbrica usaste? ¿La puedes subir a recursos?', d:hAgo(10)}]},
  {id:'p3', author:'luz', cat:'Promoción de la lectura', kind:'full', grade:'7', area:'Lengua castellana', title:'Mis estudiantes de 7.º grabaron reseñas en pódcast y ahora se recomiendan libros', body:'Partimos del recurso "Pódcast de recreo". Cada grupo eligió un libro de la biblioteca escolar y grabó una reseña de tres minutos con el celular. Las pusimos a sonar en el descanso por el altavoz del colegio. La semana siguiente, la bibliotecaria me contó que se prestaron once de los libros reseñados.', problem:'Leían por la nota y no hablaban de lo que leían.', strategy:'Promoción de la lectura con producción de audio y una audiencia real.', results:'Once préstamos nuevos en una semana y estudiantes pidiendo grabar una segunda temporada.', recommend:'No se preocupen por la calidad del audio. Lo importante es que alguien los escuche.', questions:'¿Cómo recomiendo un libro sin contar el final? ¿Qué hace que alguien quiera leerlo?', tools:'Celulares para grabar y pódcast de reseñas que ellos mismos escuchan como modelo.', proc:['Crear para comunicar','Explicar con sus palabras'], tags:['pódcast','biblioteca escolar','oralidad'], likes:57, date:hAgo(50), linkedResource:'r7', comments:[{id:'c9', a:'paola', t:'Quiero hacerlo con relatos de los abuelos del barrio. Ya les contaré.', d:hAgo(30)}]},
  {id:'p4', author:'paola', cat:'Ideas para el aula', kind:'full', grade:'8', area:'Ciencias sociales', title:'Cartografía social del barrio: el mapa lo dibujaron ellos', body:'Recorrimos con 8.º tres cuadras alrededor del colegio. Cada grupo marcó lugares seguros, lugares de encuentro y lugares que les dan miedo. De vuelta en el salón armamos un mapa grande en papel kraft. Salieron temas que en el libro de sociales nunca aparecen: el río, las inundaciones, la cancha que se perdió.', problem:'Las ciencias sociales se sentían lejanas a la vida del barrio.', strategy:'Cartografía social y aprendizaje colaborativo.', results:'El mapa quedó expuesto en la entrada y lo usamos en la asamblea de padres.', recommend:'Gestionen los permisos de salida con tiempo. Si no se puede salir, trabajen con mapas impresos.', questions:'¿Por qué se inunda la cancha y no el parque? ¿Quién decide dónde se construye?', proc:['Transferir a otro contexto','Formular preguntas'], tags:['territorio','cartografía social'], likes:39, date:hAgo(72), linkedResource:'r4', comments:[{id:'c10', a:'andres', t:'Hice una versión con mapas impresos y la memoria de los chicos. También funcionó muy bien.', d:hAgo(60)}]},
  {id:'pl2', author:'laura.gomez@iesanjose.edu.co', cat:'Promoción de la lectura', kind:'full', grade:'10', area:'Lengua castellana', title:'Repliqué el pódcast de recreo con 10.º: reseñas de libros que ellos eligieron', body:'Tomé la idea de Luz Dary y la adapté a 10.º. En vez de libros de la biblioteca, cada grupo eligió un libro que hubiera visto recomendado en redes y luego lo contrastó con una reseña escrita por un crítico.', linkedPost:'p3', linkedResource:'r7', problem:'Que leyeran con criterio propio y no solo por recomendación de un influenciador.', stuck:'Les costó pasar de "me gustó" a dar razones. Les sirvió escuchar dos reseñas de pódcast profesionales antes de grabar.', tools:'TikTok como punto de partida, reseñas escritas para contrastar y el celular para grabar.', proc:['Contrastar fuentes','Crear para comunicar'], tags:['pódcast','lectura crítica'], likes:21, date:hAgo(120), comments:[{id:'cl1', a:'luz', t:'¡Qué bueno verlo en 10.º! Me encanta lo de contrastar con un crítico.', d:hAgo(110)}]},

function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'ahora';
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24);
  if (d < 7) return `hace ${d} ${d === 1 ? 'día' : 'días'}`;
  return new Date(iso).toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });
}

function resizeImage(file, max) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* Avanza de 0 a 1 mientras la sección atraviesa la pantalla (para animaciones de scroll). */
function useScrollProgress(ref) {
  const [p, setP] = useState(0);
  useEffect(() => {
    let raf = 0;
    const tick = () => { raf = 0; const el = ref.current; if (!el) return; const r = el.getBoundingClientRect(); const vh = window.innerHeight || 800; setP(Math.max(0, Math.min(1, (vh - r.top) / (vh + r.height)))); };
    const on = () => { if (!raf) raf = requestAnimationFrame(tick); };
    tick(); window.addEventListener('scroll', on, { passive: true }); window.addEventListener('resize', on);
    return () => { window.removeEventListener('scroll', on); window.removeEventListener('resize', on); cancelAnimationFrame(raf); };
  }, []);
  return p;
}

/* ---------- Mapa del universo transmedia ---------- */
function UniverseMap({ sel, setSel, onAction }) {
  const related = id => UNIVERSE_EDGES.filter(e => e.from === id || e.to === id);
  const isLit = e => sel === 'hub' ? true : (e.from === sel || e.to === sel);
  const spokeLit = id => sel === 'hub' || sel === id;
  const ids = ['reels', 'podcast', 'comunidad', 'posters'];
  const P = NODE_POS;
  const R = id => id === 'hub' ? 58 : 44; // radio del nodo en unidades del viewBox, para que la flecha no quede debajo
  const curve = (a, b, bend = 0) => {
    let [x1, y1] = [P[a][0] * 10, P[a][1] * 6.2], [x2, y2] = [P[b][0] * 10, P[b][1] * 6.2];
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
    const cx_ = mx - dy / L * bend, cy_ = my + dx / L * bend;
    const t1 = Math.hypot(cx_ - x1, cy_ - y1) || 1, t2 = Math.hypot(x2 - cx_, y2 - cy_) || 1;
    x1 += (cx_ - x1) / t1 * R(a); y1 += (cy_ - y1) / t1 * R(a);
    x2 -= (x2 - cx_) / t2 * R(b); y2 -= (y2 - cy_) / t2 * R(b);
    return `M${x1},${y1} Q${cx_},${cy_} ${x2},${y2}`;
  };
  const labelPos = { 'podcast-reels': [50, 6], 'reels-comunidad': [31, 63], 'comunidad-podcast': [73, 59], 'posters-hub': [22, 70] };
  return html`<div>
    <!-- Escritorio: constelación -->
    <div className="hidden md:block relative w-full aspect-[1000/620] select-none">
      <svg viewBox="0 0 1000 620" className="absolute inset-0 w-full h-full" aria-hidden="true">

const FREE_DOMAINS = ['gmail.com','hotmail.com','outlook.com','yahoo.com','yahoo.es','live.com','icloud.com','hotmail.es','outlook.es','msn.com'];
function domainKind(email) {
  const d = (email.split('@')[1] || '').toLowerCase().trim();
  if (!d || !d.includes('.')) return null;
  if (FREE_DOMAINS.includes(d)) return 'personal';
  if (/(^|\.)edu(\.[a-z]{2})?$|\.edu\.|educacion|sedu|\.gov\.co$/.test(d)) return 'institutional';
  return 'unknown';
}
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e.trim());
function DomainHint({ email }) {
  if (!validEmail(email)) return null;
  const k = domainKind(email);
  const m = {
    institutional: ['shield', 'text-teal-d', 'Dominio educativo reconocido. La revisión docente será más rápida.'],
    unknown: ['info', 'text-violet-d', 'No conocemos este dominio todavía. Muchas instituciones usan uno propio: un moderador lo revisará.'],
    personal: ['info', 'text-[#8A5300]', 'Es un correo personal. Usaremos la validación manual, sin pedirte documento de identidad.'],
  }[k];
  return html`<p className=${cx('mt-1.5 flex gap-1.5 text-[13px] leading-snug', m[1])}><${Icon} name=${m[0]} size=${15} className="mt-px" />${m[2]}</p>`;
}

  return html`<div className="grid gap-4">
    <div><label className=${labelC} htmlFor=${idp + '-name'}>Nombre completo</label><input id=${idp + '-name'} className=${inputC} value=${f.name} onChange=${e => set({ ...f, name: e.target.value })} placeholder="Ej.: Laura Gómez Restrepo" autoComplete="name" />${err('name')}</div>
    ${showEmail && html`<div><label className=${labelC} htmlFor=${idp + '-email'}>Correo institucional</label><input id=${idp + '-email'} type="email" className=${inputC} value=${f.email} disabled=${emailLocked} onChange=${e => set({ ...f, email: e.target.value })} placeholder="nombre@tuinstitucion.edu.co" autoComplete="email" />${err('email')}<${DomainHint} email=${f.email} /></div>`}
    <div className="grid sm:grid-cols-2 gap-4">

      <div><label className=${labelC} htmlFor=${idp + '-city'}>Ciudad o municipio</label><input id=${idp + '-city'} className=${inputC} value=${f.city} onChange=${e => set({ ...f, city: e.target.value })} placeholder="Ej.: Medellín" />${err('city')}</div>

    </fieldset>
  </div>`;
}

    <div><label className=${labelC} htmlFor="mv-note">Cuéntanos qué y dónde enseñas <span className="font-normal text-mute">(opcional)</span></label><textarea id="mv-note" rows="2" className=${inputC} value=${m.note} onChange=${e => set({ ...m, note: e.target.value })} placeholder="Ej.: Soy docente provisional de matemáticas en la sede rural."></textarea></div>
  </div>`;
}
const emptyProfile = () => ({ name: '', email: '', institution: '', city: '', areas: [], grades: [] });
const emptyManual = () => ({ contact: '', channel: '', dane: '', note: '' });
function validateProfile(f, needEmail) {
  const e = {};
  if (f.name.trim().length < 3) e.name = 'Escribe tu nombre completo.';
  if (needEmail && !validEmail(f.email)) e.email = 'Revisa el correo: debe tener el formato nombre@dominio.';
  if (!f.institution.trim()) e.institution = 'Escribe el nombre de tu institución.';
  if (!f.city.trim()) e.city = 'Escribe tu ciudad o municipio.';
  if (!f.areas.length) e.areas = 'Elige al menos un área.';
  if (!f.grades.length) e.grades = 'Elige al menos un grado.';
  return e;
}

              <div className="relative"><input id="rg-pass" type=${showPass ? 'text' : 'password'} className=${inputC + ' pr-11'} value=${pass} onChange=${e => setPass(e.target.value)} autoComplete="new-password" placeholder="Mínimo 8 caracteres" />
              <button type="button" aria-label=${showPass ? 'Ocultar contraseña' : 'Mostrar contraseña'} className="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-mute hover:text-ink" onClick=${() => setShowPass(!showPass)}><${Icon} name=${showPass ? 'eyeoff' : 'eye'} size=${18} /></button></div>
              <div className="mt-2 flex gap-1">${[0, 1, 2].map(i => html`<span key=${i} className=${cx('h-1 flex-1 rounded-full', pass.length >= [1, 8, 12][i] ? ['bg-[#E5484D]', 'bg-sun', 'bg-teal-d'][Math.min(2, pass.length >= 12 ? 2 : pass.length >= 8 ? 1 : 0)] : 'bg-ink/10')}></span>`)}</div>
              ${errs.pass && html`<p className="mt-1 text-[13px] text-[#B42318]">${errs.pass}</p>`}
            </div>
            <label data-err=${errs.privacy ? '1' : undefined} className="flex items-start gap-2.5 text-[14px] text-ink/85 cursor-pointer"><input id="rg-privacy" type="checkbox" className="w-4 h-4 mt-0.5 accent-[#6A45F5]" checked=${privacy} onChange=${e => setPrivacy(e.target.checked)} />
              <span>Acepto la política de privacidad y autorizo el tratamiento de mis datos personales según la Ley 1581 de 2012. Mi correo y los datos de verificación no serán públicos.</span></label>
            ${errs.privacy && html`<p className="-mt-2 text-[13px] text-[#B42318]">${errs.privacy}</p>`}
            ${Object.keys(errs).length > 0 && html`<p className="text-[14px] text-[#B42318] rounded-xl bg-[#FEF0EF] px-3 py-2">Revisa los campos marcados para continuar.</p>`}
            <button className=${btnP + ' !py-3'}>Crear cuenta</button>
          </form>`}
        </div>`}
      </div>
    </main>
    <${GooglePicker} open=${gOpen} onClose=${() => setGOpen(false)} onPick=${(em, n) => { setGOpen(false); actions.google(em, n); }} />
  </div>`;
}

/* ===================== COMPLETAR PERFIL (GOOGLE) ===================== */
function CompleteProfile({ me, actions, onInfo }) {
  const [f, setF] = useState({ ...emptyProfile(), name: me.name, email: me.email });
  const kind = domainKind(me.email);
  const [noInst, setNoInst] = useState(kind === 'personal');
  const [manual, setManual] = useState(emptyManual());
  const [privacy, setPrivacy] = useState(false);
  const [errs, setErrs] = useState({});
  const manualPath = noInst || kind === 'personal';
  const submit = e => {
    e.preventDefault();
    const er = validateProfile(f, false);
    if (manualPath && !manual.contact.trim() && !manual.channel.trim()) er.manual = 'Indícanos al menos un contacto o un medio para confirmar tu vinculación.';
    if (!privacy) er.privacy = 'Debes aceptar la política de privacidad para continuar.';
    setErrs(er);
    if (!Object.keys(er).length) actions.completeProfile(f, manualPath ? manual : null, kind);
  };
  return html`<div className="min-h-full bg-mist">
    <${StatusTopbar} onLogout=${actions.logout} onHome=${actions.toLanding} onInfo=${onInfo} />
    <main className="max-w-2xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
      <${Stepper} me=${me} />
      <div className="mt-6 rounded-3xl bg-white border border-line p-5 sm:p-8">
        <div className="flex items-center gap-2 text-teal-d text-[14px] font-bold"><${Icon} name="check" size=${16} sw=${3} /> Google confirmó tu correo · ${me.email}</div>
        <h1 className="font-display text-[26px] font-extrabold text-ink mt-3">Completa tu perfil docente</h1>
        <p className="text-mute mt-1">Tu correo ya está verificado. Ahora necesitamos confirmar que eres docente. Con estos datos también personalizamos tu inicio.</p>
        <form className="mt-6 grid gap-4" onSubmit=${submit} noValidate>
          <${ProfileFields} f=${f} set=${setF} errs=${errs} idp="cp" />
          ${kind !== 'personal' && html`<label className="flex items-center gap-2.5 text-[14px] text-ink cursor-pointer"><input id="cp-noinst" type="checkbox" className="w-4 h-4 accent-[#6A45F5]" checked=${noInst} onChange=${e => setNoInst(e.target.checked)} /> Este no es un correo de mi institución</label>`}
          ${manualPath && html`<div><${ManualFields} m=${manual} set=${setManual} />${errs.manual && html`<p className="mt-1 text-[13px] text-[#B42318]">${errs.manual}</p>`}</div>`}
          <label className="flex items-start gap-2.5 text-[14px] text-ink/85 cursor-pointer"><input id="cp-privacy" type="checkbox" className="w-4 h-4 mt-0.5 accent-[#6A45F5]" checked=${privacy} onChange=${e => setPrivacy(e.target.checked)} /><span>Acepto la política de privacidad y el tratamiento de mis datos personales.</span></label>
          ${errs.privacy && html`<p className="-mt-2 text-[13px] text-[#B42318]">${errs.privacy}</p>`}
          <button className=${btnP + ' !py-3'}>Enviar a revisión</button>
        </form>
      </div>
    </main>
  </div>`;
}

/* ===================== VERIFICACIÓN ===================== */
function StatusTopbar({ onLogout, onHome, onInfo }) {
  return html`<header className="bg-white border-b border-line"><div className="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
    <${Logo} small onClick=${onHome} />
    <div className="flex items-center gap-2"><span className="hidden sm:inline"><${PrototypeBadge} onClick=${onInfo} /></span><button className=${btnG} onClick=${onLogout}><${Icon} name="logout" size=${17} /> Salir</button></div>
  </div></header>`;
}
function Stepper({ me }) {
  const st = [
    { k: 'mail', t: 'Correo', s: me.emailVerified ? 'Verificado' : 'Pendiente', done: me.emailVerified, cur: !me.emailVerified },
    { k: 'shield', t: 'Identidad docente', s: me.teacherStatus === 'verified' ? 'Aprobada' : me.teacherStatus === 'pending' ? (me.emailVerified ? 'En revisión' : 'En espera') : 'Falta tu perfil', done: me.teacherStatus === 'verified', cur: me.emailVerified && me.teacherStatus !== 'verified' },
    { k: 'users', t: 'Acceso a la comunidad', s: me.emailVerified && me.teacherStatus === 'verified' ? 'Habilitado' : 'Bloqueado', done: me.emailVerified && me.teacherStatus === 'verified', cur: false },
  ];
  return html`<ol className="grid grid-cols-3 gap-2" aria-label="Progreso de verificación">
    ${st.map((x, i) => html`<li key=${x.t} className="flex flex-col items-center text-center relative">
      ${i > 0 && html`<span className=${cx('absolute top-5 right-1/2 w-full h-0.5 -z-0', st[i - 1].done ? 'bg-teal-d' : 'bg-line')}></span>`}
      <span className=${cx('relative z-10 grid place-items-center w-10 h-10 rounded-full border-2 transition', x.done ? 'bg-teal-d border-teal-d text-white' : x.cur ? 'bg-white border-violet text-violet-d ring-4 ring-violet/15' : 'bg-white border-line text-mute')}><${Icon} name=${x.done ? 'check' : x.k} size=${18} sw=${x.done ? 3 : 2} /></span>
      <span className="mt-2 text-[13px] sm:text-[14px] font-bold text-ink leading-tight">${x.t}</span>
      <span className=${cx('text-[12px]', x.done ? 'text-teal-d' : x.cur ? 'text-violet-d font-semibold' : 'text-mute')}>${x.s}</span>
    </li>`)}
  </ol>`;
}
function VerifyScreen({ me, actions, toast, onInfo }) {
  const state = !me.emailVerified ? 'email' : me.teacherStatus !== 'verified' ? 'teacher' : 'ok';
  const pathLabel = me.reviewPath === 'domain' ? 'Automática por dominio institucional' : 'Validación manual por un moderador';
  const card = {
    email: { icon: 'mail', tone: 'bg-violet-soft text-violet-d', t: 'Revisa tu bandeja de entrada', d: html`Enviamos un enlace de verificación a <strong className="text-ink">${me.email}</strong>. Ábrelo desde tu correo para confirmar que la dirección es tuya. Si no lo ves, revisa la carpeta de spam.` },
    teacher: { icon: 'hourglass', tone: 'bg-sun/20 text-[#8A5300]', t: 'Tu identidad docente está en revisión', d: me.reviewPath === 'domain' ? html`Tu correo ya está verificado. Como usas un dominio educativo, confirmamos tu vinculación con <strong className="text-ink">${me.institution}</strong> de forma rápida. Normalmente toma menos de un día hábil.` : html`Tu correo ya está verificado. Un moderador confirmará tu vinculación con <strong className="text-ink">${me.institution}</strong> usando el contacto que nos diste. Puede tomar de uno a tres días hábiles. No te pediremos documento de identidad.` },
    ok: { icon: 'award', tone: 'bg-teal-soft text-teal-d', t: '¡Listo! Ya eres parte de la comunidad', d: 'Tu correo y tu condición docente están verificados. Ya puedes acceder a recursos, cursos, publicaciones y eventos.' },
  }[state];
  return html`<div className="min-h-full bg-mist">
    <${StatusTopbar} onLogout=${actions.logout} onHome=${actions.toLanding} onInfo=${onInfo} />
    <main className="max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
      <p className="font-mono text-[12px] uppercase tracking-[.16em] text-violet-d">Estado de tu cuenta</p>
      <h1 className="font-display text-[clamp(1.7rem,4vw,2.3rem)] font-extrabold text-ink mt-1">Hola, ${me.name.split(' ')[0]}</h1>
      <div className="mt-7"><${Stepper} me=${me} /></div>

      <section className="mt-8 rounded-3xl bg-white border border-line p-6 sm:p-8 pop" key=${state}>
        <span className=${cx('grid place-items-center w-14 h-14 rounded-2xl', card.tone)}><${Icon} name=${card.icon} size=${26} /></span>
        <h2 className="font-display text-[24px] font-bold text-ink mt-4 balance">${card.t}</h2>
        <p className="mt-2 text-[16px] text-ink/75 leading-relaxed max-w-prose">${card.d}</p>
        <div className="mt-6 flex flex-wrap gap-3">
          ${state === 'email' && html`<button className=${btnS} onClick=${() => toast('Enviamos un nuevo enlace (simulado).', 'info')}><${Icon} name="refresh" size=${16} /> Reenviar enlace</button>`}
          ${state === 'ok' && html`<button className=${btnP + ' !px-5 !py-3'} onClick=${actions.enter}>Entrar a la comunidad <${Icon} name="arrow" size=${17} /></button>`}
        </div>
        <dl className="mt-7 grid sm:grid-cols-2 gap-3">
          <div className="rounded-2xl border border-line p-4"><dt className="text-[12px] font-bold uppercase tracking-[.08em] text-mute">Correo</dt>
            <dd className="mt-1 flex items-center gap-2 font-bold text-ink">${me.emailVerified ? html`<span className="text-teal-d"><${Icon} name="check" size=${17} sw=${3} /></span> Verificado` : html`<span className="text-violet-d"><${Icon} name="clock" size=${17} /></span> Pendiente de verificar`}</dd>
            <dd className="text-[13px] text-mute mt-0.5">${me.method === 'google' ? 'Confirmado por Google' : 'Por enlace enviado al correo'}</dd></div>
          <div className="rounded-2xl border border-line p-4"><dt className="text-[12px] font-bold uppercase tracking-[.08em] text-mute">Condición docente</dt>
            <dd className="mt-1 flex items-center gap-2 font-bold text-ink">${me.teacherStatus === 'verified' ? html`<span className="text-teal-d"><${Icon} name="check" size=${17} sw=${3} /></span> Verificada` : html`<span className="text-[#8A5300]"><${Icon} name="hourglass" size=${17} /></span> ${me.emailVerified ? 'En revisión' : 'En espera del correo'}`}</dd>
            <dd className="text-[13px] text-mute mt-0.5">${pathLabel}</dd></div>
        </dl>
      </section>

      ${state !== 'ok' && html`<section className="mt-5 rounded-3xl border-2 border-dashed border-sun/70 bg-sun/[.08] p-5 sm:p-6">
        <p className="flex items-center gap-2 font-bold text-ink"><${Icon} name="info" size=${18} /> Panel de simulación</p>
        <p className="text-[14px] text-ink/70 mt-1">En la versión real estos pasos ocurren fuera de la plataforma. Aquí puedes recorrerlos sin enviar nada.</p>
        <div className="mt-4 flex flex-wrap gap-3">
          ${state === 'email' && html`<button className=${btn + ' bg-ink text-white hover:bg-ink-2 px-4 py-2.5'} onClick=${actions.verifyEmail}><${Icon} name="mail" size=${17} /> Abrir el enlace del correo</button>`}
          ${state === 'teacher' && html`<button className=${btn + ' bg-ink text-white hover:bg-ink-2 px-4 py-2.5'} onClick=${actions.approveTeacher}><${Icon} name="shield" size=${17} /> Aprobar como moderador de KURIOSITY</button>`}
        </div>
      </section>`}

      ${state !== 'ok' && html`<section className="mt-8">
        <p className="text-[14px] font-bold text-ink flex items-center gap-2"><${Icon} name="lock" size=${16} /> Se desbloquea cuando completes ambas verificaciones</p>
        <div className="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-3">
          ${[['book', 'Recursos'], ['cap', 'Cursos'], ['users', 'Comunidad'], ['calendar', 'Eventos']].map(([i, t]) => html`<div key=${t} className="relative rounded-2xl bg-white border border-line p-4 overflow-hidden">
            <div className="blur-[2px] opacity-60"><span className="grid place-items-center w-9 h-9 rounded-xl bg-violet-soft text-violet-d"><${Icon} name=${i} size=${18} /></span><p className="font-bold text-ink mt-3">${t}</p><div className="mt-2 h-2 rounded bg-ink/10 w-3/4"></div></div>
            <span className="absolute right-3 top-3 text-mute"><${Icon} name="lock" size=${16} /></span>
          </div>`)}
        </div>
      </section>`}
      <p className="mt-8 sm:hidden"><${PrototypeBadge} onClick=${onInfo} /></p>
    </main>
  </div>`;
}
/* ===================== PUBLICACIONES ===================== */
function CatPill({ cat }) {
  const s = CAT_STYLE[cat] || CAT_STYLE['Ideas para el aula'];
  return html`<${Tag} style=${{ background: s.bg, color: s.c }}><${Icon} name=${s.icon} size=${13} />${cat}<//>`;

function PostCard({ post, ctx }) {
  const { ud, authorOf, toggleLike, toggleSavePost, addComment, openShare, openResource, openComposer, openCourse, posts, me } = ctx;
  const a = authorOf(post.author);
  const liked = ud.likes.includes(post.id);
  const saved = ud.savedPosts.includes(post.id);
  const [open, setOpen] = useState(false);
  const [txt, setTxt] = useState('');
  const [more, setMore] = useState(false);
  const [bump, setBump] = useState(false);
  const res = post.linkedResource && RES_BY_ID[post.linkedResource];
  const course = post.linkedCourse && COURSE_BY_ID[post.linkedCourse];
  const parent = post.linkedPost && posts.find(p => p.id === post.linkedPost);
  const versions = posts.filter(p => p.linkedPost === post.id).length;
  const details = [['Lo que buscaba que comprendieran', post.problem], ['Estrategia', post.strategy], ['Preguntas que surgieron', post.questions], ['Dónde se trabaron y cómo salieron', post.stuck], ['Cómo noté que comprendían', post.results], ['Herramientas y fuentes', post.tools], ['Recomendación', post.recommend]].filter(x => x[1]);
  const long = post.body.length > 280;
  const likeCount = (post.likes || 0) + (liked ? 1 : 0);
  const like = () => { toggleLike(post.id); if (!liked) { setBump(true); setTimeout(() => setBump(false), 350); } };
  const send = e => { e.preventDefault(); if (!txt.trim()) return; addComment(post.id, txt.trim()); setTxt(''); };
  const meta = [a.inst, a.city].filter(Boolean).join(' · ');
  return html`<article className="rounded-3xl bg-white border border-line p-4 sm:p-5 hover:border-violet/25 transition">
    <header className="flex items-start gap-3">
      <${Avatar} person=${a} size=${42} />
      <div className="min-w-0 flex-1">
        <p className="font-bold text-ink text-[15px] leading-tight flex items-center gap-1.5 flex-wrap">${a.name}${a.daniel && html`<span className="rounded-full bg-violet text-white text-[10.5px] px-1.5 py-0.5 font-bold">Anfitrión</span>`}${post.author === me.email && html`<span className="rounded-full bg-ink/[.07] text-ink/70 text-[10.5px] px-1.5 py-0.5 font-bold">Tú</span>`}</p>
        <p className="text-[13px] text-mute truncate">${meta ? meta + ' · ' : ''}${ago(post.date)}</p>
      </div>
      <${CatPill} cat=${post.cat} />
    </header>
    ${parent && html`<p className="mt-3 inline-flex items-center gap-1.5 text-[13px] text-violet-d font-semibold"><${Icon} name="branch" size=${14} /> Nueva versión de “${parent.title.length > 60 ? parent.title.slice(0, 60) + '…' : parent.title}”</p>`}
    <h3 className="font-display text-[19px] font-bold text-ink leading-snug mt-3 balance">${post.title}</h3>
    <div className="mt-2 flex flex-wrap gap-1.5 items-center">${post.grade && html`<${GradePill} g=${post.grade} />`}${post.area && html`<span className="inline-flex items-center rounded-md px-1.5 py-0.5 text-[12px] font-semibold" style=${{ background: (AREA_STYLE[post.area] || {}).bg, color: (AREA_STYLE[post.area] || {}).c }}>${post.area}</span>`}${post.proc && post.proc.length > 0 && html`<${ProcChips} proc=${post.proc} small />`}</div>
    <p className=${cx('mt-3 text-[15.5px] text-ink/85 leading-relaxed whitespace-pre-line', !more && long && 'line-clamp-4')}>${post.body}</p>
    ${long && html`<button className="mt-1 text-[14px] font-bold text-violet-d hover:underline" onClick=${() => setMore(!more)}>${more ? 'Ver menos' : 'Ver más'}</button>`}
    ${details.length > 0 && html`<details className="mt-3 group rounded-2xl bg-mist border border-line">
      <summary className="cursor-pointer list-none flex items-center justify-between px-4 py-2.5 text-[14px] font-bold text-ink">Cómo fue el proceso de aprendizaje <span className="text-mute group-open:rotate-180 transition"><${Icon} name="chevdown" size=${17} /></span></summary>
      <dl className="grid sm:grid-cols-2 gap-3 px-4 pb-4">${details.map(([k, v]) => html`<div key=${k}><dt className="text-[11.5px] font-bold uppercase tracking-[.08em] text-violet-d">${k}</dt><dd className="text-[14px] text-ink/85 mt-0.5 leading-snug">${v}</dd></div>`)}</dl>
    </details>`}
    ${post.image && html`<img src=${post.image} alt="Imagen adjunta" className="mt-3 rounded-2xl w-full max-h-[360px] object-cover border border-line" />`}
    ${post.attachment && html`<button className="mt-3 flex items-center gap-3 w-full rounded-2xl border border-line px-3 py-2.5 text-left hover:bg-mist transition" onClick=${() => ctx.toast('Descarga simulada: ' + post.attachment.name, 'info')}><span className="grid place-items-center w-9 h-9 rounded-xl bg-violet-soft text-violet-d"><${Icon} name="paperclip" size=${17} /></span><span className="text-[14px] font-semibold text-ink truncate">${post.attachment.name}</span><span className="ml-auto text-mute"><${Icon} name="download" size=${17} /></span></button>`}
    ${(res || course) && html`<div className="mt-3 flex flex-wrap gap-2">
      ${res && html`<button className="inline-flex items-center gap-2 rounded-xl border border-teal-d/25 bg-teal-soft px-3 py-2 text-[13px] font-semibold text-teal-d hover:border-teal-d/50 transition max-w-full" onClick=${() => openResource(res.id)}><${Icon} name="book" size=${15} /><span className="truncate">Basado en: ${res.title}</span></button>`}
      ${course && html`<button className="inline-flex items-center gap-2 rounded-xl border border-violet/25 bg-violet-soft px-3 py-2 text-[13px] font-semibold text-violet-d max-w-full" onClick=${() => openCourse(course.id)}><${Icon} name="cap" size=${15} /><span className="truncate">Aplicación del curso: ${course.title}</span></button>`}
    </div>`}
    ${post.tags && post.tags.length > 0 && html`<p className="mt-3 flex flex-wrap gap-x-2 gap-y-1 text-[13px] text-mute">${post.tags.map(t => html`<span key=${t}>#${t.replace(/\s+/g, '')}</span>`)}</p>`}
    <footer className="mt-3 pt-2 border-t border-line flex items-center gap-0.5 sm:gap-1 flex-wrap">
      <button onClick=${like} aria-pressed=${liked} className=${cx('inline-flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-[14px] font-semibold transition', liked ? 'text-[#D6336C] bg-[#FDECF2]' : 'text-ink/70 hover:bg-ink/5')}><span className=${bump ? 'heart-bump' : ''}><${Icon} name="heart" size=${18} fill=${liked ? 'currentColor' : 'none'} /></span>${likeCount}<span className="sr-only">me gusta</span></button>
      <button onClick=${() => setOpen(!open)} aria-expanded=${open} className="inline-flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-[14px] font-semibold text-ink/70 hover:bg-ink/5"><${Icon} name="message" size=${18} />${post.comments.length}<span className="hidden sm:inline">comentarios</span></button>
      <button onClick=${() => toggleSavePost(post.id)} aria-pressed=${saved} className=${cx('inline-flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-[14px] font-semibold transition', saved ? 'text-violet-d bg-violet-soft' : 'text-ink/70 hover:bg-ink/5')}><${Icon} name="bookmark" size=${18} fill=${saved ? 'currentColor' : 'none'} /><span className="hidden sm:inline">${saved ? 'Guardada' : 'Guardar'}</span></button>
      <button onClick=${() => openShare(post.id)} className="inline-flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-[14px] font-semibold text-ink/70 hover:bg-ink/5"><${Icon} name="share" size=${18} /><span className="hidden sm:inline">Compartir</span></button>
      ${post.author !== me.email && html`<button onClick=${() => openComposer({ linkedPost: post.id, linkedResource: post.linkedResource, cat: post.cat === 'Preguntas entre docentes' ? 'Experiencias exitosas' : post.cat, grade: post.grade, area: post.area })} className="ml-auto inline-flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-[14px] font-bold text-violet-d hover:bg-violet-soft" title="Publica tu propia versión de esta idea"><${Icon} name="branch" size=${17} />Crear mi versión${versions > 0 ? html`<span className="font-mono text-[11px] bg-violet-soft rounded px-1">${versions}</span>` : ''}</button>`}
    </footer>
    ${open && html`<div className="mt-2 grid gap-3">
      ${post.comments.length === 0 && html`<p className="text-[14px] text-mute px-1">Todavía no hay comentarios. ¿Qué le preguntarías a ${a.daniel ? 'Daniel' : a.name.split(' ')[0]}?</p>`}
      ${post.comments.map(c => { const ca = authorOf(c.a); return html`<div key=${c.id} className="flex gap-2.5">
        <${Avatar} person=${ca} size=${32} />
        <div className="min-w-0 flex-1 rounded-2xl bg-mist px-3.5 py-2.5"><p className="text-[13px]"><strong className="text-ink">${ca.name}</strong> <span className="text-mute">· ${ago(c.d)}</span></p><p className="text-[14.5px] text-ink/85 leading-snug mt-0.5">${c.t}</p></div>
      </div>`; })}
      <form onSubmit=${send} className="flex gap-2 items-center">
        <${Avatar} person=${authorOf(me.email)} size=${32} />

/* ===================== COMPOSITOR ===================== */
function Composer({ open, init, me, onClose, onPublish, posts }) {
  const blank = () => ({ kind: 'full', title: '', cat: 'Experiencias exitosas', grade: (me.grades || [])[0] || 'all', area: (me.areas || [])[0] || 'Transversales', body: '', problem: '', strategy: '', questions: '', stuck: '', results: '', tools: '', recommend: '', proc: [], tags: '', image: null, attachment: null, linkedResource: null, linkedCourse: null, linkedPost: null });
  const [f, setF] = useState(blank());
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (open) { const b = blank(); setF({ ...b, ...(init || {}), kind: (init && init.kind) || (init && init.cat === 'Preguntas entre docentes' ? 'short' : 'full') }); setErr(''); } }, [open]);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const res = f.linkedResource && RES_BY_ID[f.linkedResource];
  const course = f.linkedCourse && COURSE_BY_ID[f.linkedCourse];
  const parent = f.linkedPost && posts.find(p => p.id === f.linkedPost);
  const onImg = async e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    if (file.type.startsWith('image/')) { setBusy(true); try { set('image', await resizeImage(file, 1000)); } catch (x) { setErr('No pudimos leer la imagen. Prueba con otro archivo JPG o PNG.'); } setBusy(false); }
    else set('attachment', { name: file.name });
    e.target.value = '';
  };
  const publish = e => {
    e.preventDefault();
    if (f.kind === 'short' ? !f.body.trim() : !f.title.trim()) { setErr(f.kind === 'short' ? 'Escribe tu pregunta o idea para publicarla.' : 'Ponle un título a tu experiencia.'); return; }
    const title = f.title.trim() || (f.body.trim().length > 90 ? f.body.trim().slice(0, 88) + '…' : f.body.trim());
    onPublish({ ...f, title, body: f.body.trim() || '', tags: f.tags.split(',').map(t => t.trim().replace(/^#/, '')).filter(Boolean) });
  };
  const ta = (id, label, k, ph, rows = 2) => html`<div><label className=${labelC} htmlFor=${id}>${label} <span className="font-normal text-mute">(opcional)</span></label><textarea id=${id} rows=${rows} className=${inputC} value=${f[k]} placeholder=${ph} onChange=${e => set(k, e.target.value)}></textarea></div>`;
  return html`<${Modal} open=${open} onClose=${onClose} size="max-w-2xl" label="Compartir una experiencia">
    <${CloseBtn} onClick=${onClose} />
    <form onSubmit=${publish} noValidate>
      <div className="px-5 sm:px-7 pt-6 pb-4 border-b border-line">
        <p className="font-mono text-[12px] uppercase tracking-[.16em] text-violet-d">${parent ? 'Cocrear' : res ? 'Así lo apliqué en mi aula' : 'Compartir'}</p>
        <h2 className="font-display text-[24px] font-extrabold text-ink mt-1 pr-10">${parent ? 'Publica tu versión de esta idea' : 'Compartir una experiencia'}</h2>
        <div className="mt-4 inline-flex p-1 rounded-xl bg-mist border border-line">
          ${[['full', 'Experiencia completa'], ['short', 'Pregunta o idea breve']].map(([k, l]) => html`<button type="button" key=${k} onClick=${() => { set('kind', k); if (k === 'short' && f.cat === 'Experiencias exitosas') set('cat', 'Preguntas entre docentes'); if (k === 'full' && f.cat === 'Preguntas entre docentes') set('cat', 'Experiencias exitosas'); }} className=${cx('rounded-lg px-3 py-1.5 text-[13.5px] font-bold transition', f.kind === k ? 'bg-white shadow-sm text-ink' : 'text-mute')}>${l}</button>`)}
        </div>
      </div>
      <div className="px-5 sm:px-7 py-5 grid gap-4">
        ${(res || course || parent) && html`<div className="flex flex-wrap gap-2">
          ${res && html`<span className="inline-flex items-center gap-2 rounded-xl bg-teal-soft px-3 py-2 text-[13px] font-semibold text-teal-d max-w-full"><${Icon} name="book" size=${15} /><span className="truncate">Vinculado al recurso: ${res.title}</span></span>`}
          ${course && html`<span className="inline-flex items-center gap-2 rounded-xl bg-violet-soft px-3 py-2 text-[13px] font-semibold text-violet-d max-w-full"><${Icon} name="cap" size=${15} /><span className="truncate">Vinculado al curso: ${course.title}</span></span>`}
          ${parent && html`<span className="inline-flex items-center gap-2 rounded-xl bg-violet-soft px-3 py-2 text-[13px] font-semibold text-violet-d max-w-full"><${Icon} name="branch" size=${15} /><span className="truncate">Versión de: ${parent.title}</span></span>`}
        </div>`}
        <${DanielNote}>${f.kind === 'short' ? '¿Y si convertimos esa dificultad en una pregunta para la comunidad?' : 'No todas las ideas funcionan a la primera. Cuéntanos el camino y no solo el resultado: dónde se trabaron tus estudiantes y cómo salieron.'}<//>
        <div><label className=${labelC} htmlFor="cp-title">${f.kind === 'short' ? 'Título' : 'Título'} ${f.kind === 'short' && html`<span className="font-normal text-mute">(opcional)</span>`}</label><input id="cp-title" className=${inputC} value=${f.title} onChange=${e => set('title', e.target.value)} placeholder=${f.kind === 'short' ? 'Ej.: ¿Cómo evalúan la participación oral?' : 'Ej.: Debate sobre IA con 10.º: lo que pasó'} /></div>
        <div className="grid sm:grid-cols-3 gap-3">
          <div><label className=${labelC} htmlFor="cp-cat">Tipo de publicación</label><select id="cp-cat" className=${inputC} value=${f.cat} onChange=${e => set('cat', e.target.value)}>${CATS.map(c => html`<option key=${c}>${c}</option>`)}</select></div>
          <div><label className=${labelC} htmlFor="cp-grade">Grado</label><select id="cp-grade" className=${inputC} value=${f.grade} onChange=${e => set('grade', e.target.value)}><option value="all">Todos los grados</option>${GRADES.map(g => html`<option key=${g} value=${g}>${g}.º</option>`)}</select></div>
          <div><label className=${labelC} htmlFor="cp-area">Área</label><select id="cp-area" className=${inputC} value=${f.area} onChange=${e => set('area', e.target.value)}>${AREAS.map(a => html`<option key=${a}>${a}</option>`)}</select></div>
        </div>
        <div><label className=${labelC} htmlFor="cp-body">${f.kind === 'short' ? 'Tu pregunta o idea' : 'Descripción de la experiencia'}</label><textarea id="cp-body" rows=${f.kind === 'short' ? 4 : 4} className=${inputC} value=${f.body} onChange=${e => set('body', e.target.value)} placeholder=${f.kind === 'short' ? 'Cuéntale a la comunidad qué te estás preguntando…' : '¿Qué hiciste, con quiénes y cómo lo viviste?'}></textarea></div>
        ${f.kind === 'full' && html`<fieldset className="grid gap-3 rounded-2xl border border-line p-4">
          <legend className="px-1.5 font-display text-[16px] font-bold text-ink">El proceso de aprendizaje</legend>
          <div className="grid sm:grid-cols-2 gap-3">
            ${ta('cp-prob', '¿Qué querías que tus estudiantes comprendieran?', 'problem', 'Ej.: Que la lectura sirve para responder sus propias preguntas.')}
            ${ta('cp-strat', '¿Qué estrategia utilizaste?', 'strategy', 'Ej.: Club de lectura con roles.')}
            ${ta('cp-qs', '¿Qué preguntas surgieron en el camino?', 'questions', 'Las de ellos y las tuyas.')}
            ${ta('cp-stuck', '¿Dónde se trabaron y cómo se destrabaron?', 'stuck', 'El error también enseña.')}
            ${ta('cp-res', '¿Cómo notaste que estaban comprendiendo?', 'results', 'Ej.: Lo explicaron con sus palabras a otro grupo.')}
            ${ta('cp-tools', '¿Qué herramientas o fuentes usaron y cómo les ayudaron a pensar?', 'tools', 'Libros, videos, redes, IA, entrevistas…')}
          </div>
          ${ta('cp-rec', '¿Qué recomendarías a otros docentes?', 'recommend', 'Lo que harías distinto.')}
          <div><p className=${labelC}>¿Qué procesos de pensamiento activó? <span className="font-normal text-mute">(opcional)</span></p>
            <div className="flex flex-wrap gap-1.5">${PROCESSES.map(p => html`<${Chip} key=${p} active=${(f.proc || []).includes(p)} onClick=${() => set('proc', (f.proc || []).includes(p) ? f.proc.filter(x => x !== p) : [...(f.proc || []), p])}>${p}<//>`)}</div></div>
        </fieldset>`}
        <div><label className=${labelC} htmlFor="cp-tags">Etiquetas <span className="font-normal text-mute">(separadas por comas, opcional)</span></label><input id="cp-tags" className=${inputC} value=${f.tags} onChange=${e => set('tags', e.target.value)} placeholder="lectura, 7.º, trabajo en equipo" /></div>
        <div>
          <span className=${labelC}>Archivos o imágenes <span className="font-normal text-mute">(opcional)</span></span>
          <div className="flex flex-wrap gap-2 items-center">
            <label className=${btnS + ' cursor-pointer !py-2'}><${Icon} name="image" size=${17} /> ${busy ? 'Cargando…' : 'Agregar imagen o archivo'}<input id="cp-file" type="file" className="sr-only" onChange=${onImg} /></label>
            ${f.attachment && html`<span className="inline-flex items-center gap-2 rounded-xl bg-mist border border-line px-3 py-2 text-[13px]"><${Icon} name="paperclip" size=${14} />${f.attachment.name}<button type="button" aria-label="Quitar archivo" onClick=${() => set('attachment', null)} className="text-mute hover:text-ink"><${Icon} name="x" size=${14} /></button></span>`}
          </div>
          ${f.image && html`<div className="relative mt-3 inline-block"><img src=${f.image} alt="Vista previa" className="h-28 rounded-xl border border-line object-cover" /><button type="button" aria-label="Quitar imagen" onClick=${() => set('image', null)} className="absolute -right-2 -top-2 w-7 h-7 grid place-items-center rounded-full bg-ink text-white"><${Icon} name="x" size=${14} /></button></div>`}
          <p className="mt-1.5 text-[12.5px] text-mute">Los archivos no se suben a ningún servidor en el prototipo. Evita incluir datos personales de estudiantes.</p>
        </div>
        ${err && html`<p className="text-[14px] text-[#B42318] rounded-xl bg-[#FEF0EF] px-3 py-2">${err}</p>`}
      </div>
      <div className="sticky bottom-0 bg-white/95 backdrop-blur border-t border-line px-5 sm:px-7 py-4 flex items-center justify-end gap-3">
        <div className="mr-auto min-w-0"><${ComposerPoints} f=${f} me=${me} posts=${posts} /></div>
        <button type="button" className=${btnS} onClick=${onClose}>Cancelar</button>
        <button className=${btnP}><${Icon} name="send" size=${16} /> Publicar</button>
      </div>
    </form>
  <//>`;
}

function Community({ ctx, initialQuery = '' }) {
  const { posts, openComposer, me } = ctx;
  const [cat, setCat] = useState('Todas');
  const [sort, setSort] = useState('recent');
  const [q, setQ] = useState(initialQuery);
  useEffect(() => setQ(initialQuery), [initialQuery]);
  const tip = useMemo(() => DANIEL_TIPS[Math.floor(Math.random() * DANIEL_TIPS.length)], []);
  const list = useMemo(() => {
    let l = posts.filter(p => (cat === 'Todas' || p.cat === cat));
    if (q.trim()) { const s = q.toLowerCase(); l = l.filter(p => (p.title + ' ' + p.body + ' ' + (p.tags || []).join(' ')).toLowerCase().includes(s)); }
    return [...l].sort(sort === 'recent' ? (a, b) => new Date(b.date) - new Date(a.date) : (a, b) => (b.comments.length * 3 + b.likes) - (a.comments.length * 3 + a.likes));

  const counts = useMemo(() => Object.fromEntries(CATS.map(c => [c, posts.filter(p => p.cat === c).length])), [posts]);
  return html`<div>
    <${PageHead} eyebrow="El corazón de KURIOSITY" title="Comunidad" desc="Experiencias, preguntas e ideas de docentes de todo el país. Lo que compartes aquí se convierte en punto de partida para otros profes."

          <span className="hidden sm:grid place-items-center w-10 h-10 rounded-full bg-violet text-white"><${Icon} name="edit" size=${17} /></span>
        </button>
        <div className="flex flex-wrap items-center gap-2">
          <div className="relative flex-1 min-w-[200px]"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-mute"><${Icon} name="search" size=${17} /></span><label htmlFor="cm-q" className="sr-only">Buscar en la comunidad</label><input id="cm-q" className=${inputC + ' pl-10 !py-2'} placeholder="Buscar publicaciones" value=${q} onChange=${e => setQ(e.target.value)} /></div>
          <label htmlFor="cm-sort" className="sr-only">Ordenar</label>
          <select id="cm-sort" className=${inputC + ' !w-auto !py-2'} value=${sort} onChange=${e => setSort(e.target.value)}><option value="recent">Más recientes</option><option value="active">Más conversadas</option></select>
        </div>
        <div data-guide="cm-cats" className="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 py-1 sm:mx-0 sm:px-1 sm:flex-wrap rounded-2xl">
          ${['Todas', ...CATS].map(c => html`<${Chip} key=${c} active=${cat === c} onClick=${() => setCat(c)}>${c !== 'Todas' && html`<${Icon} name=${CAT_STYLE[c].icon} size=${14} />`}${c}<//>`)}
        </div>
        ${list.length ? list.map((p, i) => i === 0 ? html`<div key=${p.id} data-guide="cm-first" className="rounded-3xl grid"><${PostCard} post=${p} ctx=${ctx} /></div>` : html`<${PostCard} key=${p.id} post=${p} ctx=${ctx} />`)
          : html`<${Empty} title="Aún no hay publicaciones aquí" action=${html`<button className=${btnP} onClick=${() => openComposer({ cat: cat === 'Todas' ? 'Preguntas entre docentes' : cat })}>Sé el primero en publicar</button>`}>Quizá la experiencia que necesitas ya la vivió otro profe y todavía no la ha contado. ¿Empezamos tú y yo?<//>`}
      </div>

const LEVEL0 = { n: 0, name: 'Docente en camino', unlock: null, color: '#59607E' };
function levelInfo(pts) {
  const n = levelOf(pts);
  const cur = n ? LEVELS[n - 1] : LEVEL0;
  const nxt = nextLevel(pts);
  const from = n ? LEVELS[n - 1].min : 0;
  const pct = nxt ? Math.max(0, Math.min(100, ((pts - from) / (nxt.min - from)) * 100)) : 100;
  return { n, cur, nxt, pct, from };
}
const POINT_LABEL = { publish: 'Publicación', replicate: 'Réplica en tu contexto', share: 'Compartido en redes', seed: 'Saldo inicial' };

function LevelBadge({ n, size = 'sm' }) {

  const first = me.name.split(' ')[0];
  const recRes = useMemo(() => {
    const score = r => (r.grades.some(g => me.grades.includes(g)) ? 2 : 0) + (me.areas.includes(r.area) ? 3 : 0);

  }, [me.grades.join(), me.areas.join()]);
  const feedList = useMemo(() => {
    const sorted = [...posts].sort((a, b) => new Date(b.date) - new Date(a.date));
    if (feed === 'featured') return [...posts].filter(p => p.kind === 'full').sort((a, b) => b.likes - a.likes).slice(0, 4);
    if (feed === 'questions') return sorted.filter(p => p.cat === 'Preguntas entre docentes').slice(0, 4);
    if (feed === 'mine') return sorted.filter(p => p.grade === 'all' || me.grades.includes(p.grade) || me.areas.includes(p.area)).slice(0, 4);
    return sorted.slice(0, 4);
  }, [posts, feed]);
  const courseList = useMemo(() => { const s = COURSES.filter(c => courseProg(c, ud).done > 0 && courseProg(c, ud).pct < 100); return [...s, ...COURSES.filter(c => !s.includes(c))].slice(0, 2); }, [ud.progress]);
  const evs = upcoming().slice(0, 3);
  const quick = [['recursos', 'book', 'Recursos para el aula', `${RESOURCES.length} materiales`, '#0B7F74', '#DCF5F1'], ['cursos', 'cap', 'Cursos para docentes', `${COURSES.length} cursos cortos`, '#5B3BE0', '#EFEBFF'], ['comunidad', 'users', 'Comunidad', `${posts.length} publicaciones`, '#A61E55', '#FBE4EE'], ['eventos', 'calendar', 'Eventos', `${upcoming().length} próximos`, '#B4470E', '#FCEBDD']];
  return html`<div className="grid gap-6">

      <div>
        <p className="font-mono text-[12px] uppercase tracking-[.16em] text-violet-d">${new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
        <h1 className="font-display text-[clamp(1.9rem,4.4vw,2.8rem)] font-extrabold text-ink tracking-tight leading-[1.05] mt-1">¡Hola, profe ${first}!</h1>
        <p className="text-mute text-[18px] mt-1">¿Qué vamos a descubrir hoy?</p>
      </div>
      <figure className="flex items-center gap-3 rounded-2xl bg-gradient-to-br from-ink to-ink-2 pl-3 pr-4 py-3 max-w-md shadow-[0_12px_30px_-14px_rgba(14,26,60,.6)]">
        <${DanielAvatar} size=${40} className="ring-2 ring-white/40" />
        <blockquote className="text-[14.5px] text-white leading-snug"><span className="font-semibold">“A veces, una buena pregunta transforma más una clase que cien diapositivas.”</span> <span className="text-white/80">— Daniel</span></blockquote>
      </figure>
    </header>

    <div data-guide="quick" className="grid grid-cols-2 lg:grid-cols-4 gap-3 rounded-2xl">
      ${quick.map(([k, i, t, d, c, bg]) => html`<button key=${k} onClick=${() => go(k)} className="group text-left rounded-2xl p-4 text-white hover:-translate-y-0.5 hover:shadow-[0_12px_30px_-12px_rgba(14,26,60,.45)] hover:brightness-110 transition" style=${{ background: `linear-gradient(135deg, ${c}, ${c}D9)` }}>
        <span className="grid place-items-center w-10 h-10 rounded-xl bg-white/20 text-white"><${Icon} name=${i} size=${20} /></span>
        <p className="font-bold text-white mt-3 leading-tight text-[15px]">${t}</p>
        <p className="text-[13px] text-white/80 mt-0.5 flex items-center gap-1">${d}<span className="opacity-0 group-hover:opacity-100 transition -translate-x-1 group-hover:translate-x-0"><${Icon} name="arrow" size=${13} /></span></p>
      </button>`)}
    </div>

    <${JourneyStrip} ctx=${ctx} />

    <div className="grid lg:grid-cols-[65fr_35fr] gap-6 items-start">
      <section className="min-w-0 grid gap-4">
        <button data-guide="compose" onClick=${() => openComposer({})} className="flex items-center gap-3 rounded-3xl bg-white border border-line p-3 sm:p-4 text-left hover:border-violet/40 transition">
          <${Avatar} person=${ctx.authorOf(me.email)} size=${40} />
          <span className="flex-1 rounded-full bg-mist px-4 py-2.5 text-mute text-[15px]">¿Probaste algo nuevo en clase? Cuéntanos cómo te fue.</span>
          <span className=${btnP + ' hidden sm:inline-flex !py-2'}>Compartir</span>
        </button>
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <h2 className="font-display text-[20px] font-bold text-ink">De la comunidad</h2>
          <div className="flex gap-1.5 overflow-x-auto no-scrollbar max-w-full">${[['recent', 'Recientes'], ['featured', 'Experiencias destacadas'], ['questions', 'Preguntas'], ['mine', 'Para mis grados']].map(([k, l]) => html`<${Chip} key=${k} active=${feed === k} onClick=${() => setFeed(k)}>${l}<//>`)}</div>
        </div>
        ${feedList.length ? feedList.map(p => html`<${PostCard} key=${p.id} post=${p} ctx=${ctx} />`) : html`<${Empty} title="Nada por aquí todavía">¿Y si convertimos esa dificultad en una pregunta para la comunidad?<//>`}
        <button className=${btnS + ' justify-self-center'} onClick=${() => go('comunidad')}>Ver toda la comunidad <${Icon} name="arrow" size=${16} /></button>
      </section>

      <aside className="grid gap-5">
        <${PointsCard} ctx=${ctx} />
        <section data-guide="side" className="rounded-3xl bg-white border border-line p-4 sm:p-5">
          <div className="flex items-center justify-between"><h2 className="font-display text-[18px] font-bold text-ink">Recursos para ti</h2><button className="text-[13px] font-bold text-violet-d hover:underline" onClick=${() => go('recursos')}>Ver todos</button></div>
          <p className="text-[13px] text-mute mt-0.5">Según tus grados (${me.grades.map(gradeLabel).join(', ')}) y área</p>
          <ul className="mt-3 grid gap-2">${recRes.map(r => html`<li key=${r.id}><button className="w-full flex items-center gap-3 rounded-2xl p-2 text-left hover:bg-mist transition" onClick=${() => ctx.openResource(r.id)}>
            <span className="grid place-items-center w-12 h-12 rounded-xl shrink-0" style=${{ background: AREA_STYLE[r.area].bg, color: AREA_STYLE[r.area].c }}><${Icon} name=${AREA_STYLE[r.area].icon} size=${20} /></span>
            <span className="min-w-0"><span className="block font-bold text-ink text-[14px] leading-snug line-clamp-2">${r.title}</span><span className="block text-[12.5px] text-mute mt-0.5">${TYPE_ONE[r.type]} · ${r.grades.map(gradeLabel).join(' ')}</span></span>
          </button></li>`)}</ul>
        </section>
        <section className="rounded-3xl bg-white border border-line p-4 sm:p-5">
          <div className="flex items-center justify-between"><h2 className="font-display text-[18px] font-bold text-ink">Cursos destacados</h2><button className="text-[13px] font-bold text-violet-d hover:underline" onClick=${() => go('cursos')}>Ver todos</button></div>
          <ul className="mt-3 grid gap-3">${courseList.map(c => { const p = courseProg(c, ud); return html`<li key=${c.id}><button className="w-full rounded-2xl border border-line p-3 text-left hover:border-violet/30 transition" onClick=${() => ctx.openCourse(c.id)}>
            <div className="flex items-center gap-3"><span className="grid place-items-center w-10 h-10 rounded-xl text-white shrink-0" style=${{ background: c.color }}><${Icon} name=${c.icon} size=${18} /></span><span className="min-w-0"><span className="block font-bold text-ink text-[14px] leading-snug">${c.title}</span><span className="block text-[12.5px] text-mute">${p.done ? p.done + ' de ' + p.total + ' lecciones' : c.duration + ' · ' + c.modules.length + ' módulos'}</span></span></div>
            ${p.done > 0 && html`<${Progress} value=${p.pct} color=${c.color} className="mt-3" />`}
          </button></li>`; })}</ul>
        </section>
        <section className="rounded-3xl bg-white border border-line p-4 sm:p-5">
          <div className="flex items-center justify-between"><h2 className="font-display text-[18px] font-bold text-ink">Próximos eventos</h2><button className="text-[13px] font-bold text-violet-d hover:underline" onClick=${() => go('eventos')}>Agenda</button></div>
          <div className="mt-3 grid gap-2">${evs.map(e => html`<${EventRow} key=${e.id} e=${e} ctx=${ctx} compact />`)}</div>
        </section>
        <${DanielNote}>Quizá la experiencia que necesitas ya la vivió otro profe. Y si no, puede que la tuya sea la que alguien está buscando.<//>
      </aside>
    </div>
  </div>`;
}

/* ===================== BUSCADOR ===================== */
function SearchBox({ ctx, onDone, autoFocus = false }) {
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(false);
  const s = q.trim().toLowerCase();
  const res = s.length > 1 ? {
    r: RESOURCES.filter(r => (r.title + ' ' + r.desc + ' ' + r.area + ' ' + r.proc.join(' ') + ' ' + (r.tool || '')).toLowerCase().includes(s)).slice(0, 4),
    p: ctx.posts.filter(p => (p.title + ' ' + p.body).toLowerCase().includes(s)).slice(0, 3),
    c: COURSES.filter(c => (c.title + ' ' + c.desc).toLowerCase().includes(s)).slice(0, 2),
  } : null;
  const total = res ? res.r.length + res.p.length + res.c.length : 0;
  const pick = fn => { fn(); setQ(''); setOpen(false); onDone && onDone(); };
  const Row = ({ icon, t, sub, fn }) => html`<li><button className="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-left hover:bg-mist" onMouseDown=${e => e.preventDefault()} onClick=${() => pick(fn)}><span className="grid place-items-center w-8 h-8 rounded-lg bg-mist text-ink/70 shrink-0"><${Icon} name=${icon} size=${15} /></span><span className="min-w-0"><span className="block text-[14px] font-semibold text-ink truncate">${t}</span><span className="block text-[12px] text-mute truncate">${sub}</span></span></button></li>`;
  return html`<div className="relative w-full">
    <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-mute pointer-events-none"><${Icon} name="search" size=${17} /></span>
    <label htmlFor="global-search" className="sr-only">Buscar en KURIOSITY</label>
    <input id="global-search" autoFocus=${autoFocus} className=${inputC + ' pl-10 !py-2 !rounded-full !bg-mist focus:!bg-white border-transparent'} placeholder="Buscar recursos, cursos o publicaciones" value=${q} onChange=${e => { setQ(e.target.value); setOpen(true); }} onFocus=${() => setOpen(true)} onBlur=${() => setTimeout(() => setOpen(false), 120)} onKeyDown=${e => { if (e.key === 'Enter' && s) pick(() => ctx.goPost(q)); }} />
    ${open && res && html`<div className="absolute left-0 right-0 top-[calc(100%+6px)] z-50 rounded-2xl bg-white border border-line shadow-xl p-2 max-h-[70vh] overflow-y-auto pop">
      ${total === 0 ? html`<p className="px-3 py-3 text-[14px] text-mute">Sin resultados para “${q}”. Prueba con otra palabra o pregúntale a la comunidad.</p>` : null}
      ${res.r.length > 0 && html`<p className="px-3 pt-1 pb-1 text-[11.5px] font-bold uppercase tracking-[.08em] text-mute">Recursos</p><ul>${res.r.map(r => html`<${Row} key=${r.id} icon="book" t=${r.title} sub=${TYPE_ONE[r.type] + ' · ' + r.area} fn=${() => ctx.openResource(r.id)} />`)}</ul>`}
      ${res.c.length > 0 && html`<p className="px-3 pt-2 pb-1 text-[11.5px] font-bold uppercase tracking-[.08em] text-mute">Cursos</p><ul>${res.c.map(c => html`<${Row} key=${c.id} icon="cap" t=${c.title} sub=${c.duration + ' · ' + c.modules.length + ' módulos'} fn=${() => ctx.openCourse(c.id)} />`)}</ul>`}
      ${res.p.length > 0 && html`<p className="px-3 pt-2 pb-1 text-[11.5px] font-bold uppercase tracking-[.08em] text-mute">Comunidad</p><ul>${res.p.map(p => html`<${Row} key=${p.id} icon="message" t=${p.title} sub=${p.cat} fn=${() => ctx.goPost(p.title)} />`)}</ul>`}
    </div>`}
  </div>`;
}
